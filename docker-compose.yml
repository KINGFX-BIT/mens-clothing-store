version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mens-store-mongodb
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=mens-clothing-store
    volumes:
      - mongodb_data:/data/db
    networks:
      - mens-store-network

  backend:
    build: ./backend
    container_name: mens-store-backend
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/mens-clothing-store
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      - mongodb
    networks:
      - mens-store-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: mens-store-frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - backend
    networks:
      - mens-store-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  mens-store-network:
    driver: bridge

volumes:
  mongodb_data:
